# 通用安全响应头。
#
# 单独成文件是因为 nginx 的 add_header 不跨 location 继承：只要某个 location（这里是
# /assets/ 与 index.html）自己写了一条 add_header，server 级的全部 add_header 对它失效。
# 官方镜像只对 /etc/nginx/templates 做 envsubst，放在 snippets/ 下不会被渲染，因此里面的
# nginx 变量（这里没有）也不会被误替换。
add_header X-Content-Type-Options "nosniff" always;
# 本站没有被第三方嵌入的场景；用 SAMEORIGIN 而不是 DENY，给同源内的预览/嵌入留余地。
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 语音作答需要麦克风（同源），摄像头与定位完全没用到。
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
