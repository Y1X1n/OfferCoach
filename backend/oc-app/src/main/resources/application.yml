server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  # 默认仅监听回环地址，避免本地/CI 实例意外暴露到局域网。
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: offercoach-app
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/offercoach}
    username: ${DB_USER:oc}
    password: ${DB_PASSWORD:oc_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    # 不设置 default-property-inclusion：null 字段按契约显式输出，前端可区分“缺失”与“null”。
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

oc:
  auth:
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    jwt:
      issuer: offercoach
      audience: offercoach-web
      key-id: oc-local
      private-key-path: ${JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    cookie:
      name: oc_rt
      secure: ${COOKIE_SECURE:false}
      same-site: Lax
      path: /api/v1/auth
    device-salt: ${DEVICE_SALT:}
    dev-verify-code:
      enabled: ${DEV_VERIFY_CODE_ENABLED:true}
      code: ${DEV_VERIFY_CODE:123456}
    invite-code:
      enabled: ${REGISTER_INVITE_ENABLED:false}
      code: ${REGISTER_INVITE_CODE:}
  quota:
    free-monthly-interviews: 3
    free-monthly-resumes: 3
    daily-session-cap: 3
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}
  demo:
    enabled: ${DEMO_ENABLED:false}
    email: ${DEMO_EMAIL:demo@offercoach.dev}
    password: ${DEMO_PASSWORD:}
    nickname: 演示用户
  admin:
    enabled: ${ADMIN_ENABLED:${ADMIN_BOOTSTRAP_ENABLED:false}}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    nickname: ${ADMIN_NICKNAME:管理员}
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    small-model: ${AI_SMALL_MODEL:deepseek-chat}
    timeout: ${AI_TIMEOUT:60s}
    # 管理端保存 API Key 的 AES-GCM 根密钥；未配置时只允许改 URL/模型。
    secret: ${OC_AI_SECRET:}
    # 生产默认禁止 AI 网关指向内网/本机，避免 SSRF；仅可信部署可显式开启。
    allow-private-hosts: ${AI_ALLOW_PRIVATE_HOSTS:false}
    # 前端已改为轮询反馈；SSE 端点默认关闭，仅保留给显式开启的兼容客户端。
    sse-enabled: ${AI_SSE_ENABLED:false}
  storage:
    root: ${STORAGE_ROOT:.local/storage}
  interview:
    min-answer-length: 10
    max-answer-length: 4000
    session-idle-abandon: 24h
    report-max-attempts: 6

logging:
  level:
    root: INFO
    com.offercoach: INFO