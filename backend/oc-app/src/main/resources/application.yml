server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  # 默认仅监听回环地址，避免本地/CI 实例意外暴露到局域网。
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: offercoach-app
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/offercoach}
    username: ${DB_USER:oc}
    password: ${DB_PASSWORD:oc_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  # Boot 4 默认 JSON 栈是 Jackson 3；本服务仍用 Jackson 2（见 spring-boot-jackson2 桥），
  # 因此配置键是 spring.jackson2.*，写回 spring.jackson.* 不会生效。
  jackson2:
    # 不设置 default-property-inclusion：null 字段按契约显式输出，前端可区分“缺失”与“null”。
    serialization:
      write-dates-as-timestamps: false
  # HTTP 转换器默认会优先用 Jackson 3；显式选 jackson2，保持与上面 ObjectMapper 一致。
  http:
    converters:
      preferred-json-mapper: jackson2
  task:
    scheduling:
      # 默认只有 1 个调度线程：保留策略一次分批删除可能跑几分钟，
      # 期间报告 worker（5s）、状态看门狗（60s）、空闲放弃（10min）全部停摆。
      pool:
        size: ${SCHEDULING_POOL_SIZE:4}
      thread-name-prefix: oc-sched-

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        oc.ai.latency: true
        oc.report.generation: true
      percentiles:
        oc.ai.latency: 0.5,0.95,0.99
        oc.report.generation: 0.5,0.95,0.99

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

oc:
  auth:
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    jwt:
      issuer: offercoach
      audience: offercoach-web
      key-id: oc-local
      private-key-path: ${JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    cookie:
      name: oc_rt
      secure: ${COOKIE_SECURE:false}
      same-site: Lax
      path: /api/v1/auth
    device-salt: ${DEVICE_SALT:}
    proxy-secret: ${AUTH_PROXY_SECRET:}
    dev-verify-code:
      enabled: ${DEV_VERIFY_CODE_ENABLED:true}
      code: ${DEV_VERIFY_CODE:123456}
    invite-code:
      enabled: ${REGISTER_INVITE_ENABLED:false}
      code: ${REGISTER_INVITE_CODE:}
  quota:
    free-monthly-interviews: 3
    free-monthly-resumes: 3
    daily-session-cap: 3
  # 订阅与额度周期到期结算：每天低峰兜底扫描，用户长期不登录也能正确降级。
  identity:
    subscription-expiry-cron: "${SUBSCRIPTION_EXPIRY_CRON:0 10 3 * * *}"
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}
  demo:
    enabled: ${DEMO_ENABLED:false}
    email: ${DEMO_EMAIL:demo@offercoach.dev}
    password: ${DEMO_PASSWORD:}
    nickname: 演示用户
  # 可选：配置后 Prometheus 抓取需携带 Authorization: Bearer <token>。
  metrics-token: ${METRICS_TOKEN:}
  admin:
    enabled: ${ADMIN_ENABLED:${ADMIN_BOOTSTRAP_ENABLED:false}}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    nickname: ${ADMIN_NICKNAME:管理员}
    # 可选：逗号分隔的 IP 白名单；为空表示不限制（管理端仍由 ADMIN 角色保护）。
    allowed-ips: ${ADMIN_ALLOWED_IPS:}
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    small-model: ${AI_SMALL_MODEL:deepseek-chat}
    timeout: ${AI_TIMEOUT:60s}
    # 管理端保存 API Key 的 AES-GCM 根密钥；未配置时只允许改 URL/模型。
    secret: ${OC_AI_SECRET:}
    # 生产默认禁止 AI 网关指向内网/本机，避免 SSRF；仅可信部署可显式开启。
    allow-private-hosts: ${AI_ALLOW_PRIVATE_HOSTS:false}
    # 前端已改为轮询反馈；SSE 端点默认关闭，仅保留给显式开启的兼容客户端。
    sse-enabled: ${AI_SSE_ENABLED:false}
    # 每日全局 token 预算；0 表示不限制，超限后业务自动走模板/启发式降级。
    daily-token-budget: ${AI_DAILY_TOKEN_BUDGET:0}
    # 成本看板估算单价：每百万 token 的微元（1 元 = 1,000,000 微元），以供应商账单为准。
    pricing:
      input-micros-per-million: ${AI_PRICE_INPUT_MICROS:2000000}
      output-micros-per-million: ${AI_PRICE_OUTPUT_MICROS:8000000}
      models:
        deepseek-chat:
          input-micros-per-million: ${AI_PRICE_DEEPSEEK_CHAT_INPUT_MICROS:2000000}
          output-micros-per-million: ${AI_PRICE_DEEPSEEK_CHAT_OUTPUT_MICROS:8000000}
    tools:
      # 服务间内部令牌：oc-app 与 oc-ai-asr/tts/ocr 必须一致；为空时工具服务拒绝所有调用。
      internal-token: ${OC_AI_INTERNAL_TOKEN:}
      asr-base-url: ${AI_ASR_BASE_URL:http://127.0.0.1:8094}
      tts-base-url: ${AI_TTS_BASE_URL:http://127.0.0.1:8095}
      ocr-base-url: ${AI_OCR_BASE_URL:http://127.0.0.1:8096}
      search-base-url: ${AI_SEARCH_BASE_URL:http://127.0.0.1:8097}
      fetch-base-url: ${AI_FETCH_BASE_URL:http://127.0.0.1:8098}
      search-max-count: ${AI_SEARCH_MAX_COUNT:10}
      # 调用日志由工具服务写入，oc-app 侧关闭避免重复。
      call-log-enabled: false
  storage:
    root: ${STORAGE_ROOT:.local/storage}
  # 支付服务间通信：oc-app 经内部令牌调用 oc-pay（下单 / 查单）。
  pay:
    internal-token: ${OC_PAY_INTERNAL_TOKEN:}
    base-url: ${OC_PAY_BASE_URL:http://127.0.0.1:8099}
  # 数据保留策略：每天低峰（默认 03:30）分批清理过期日志，避免表无限增长。
  retention:
    ai-call-days: ${RETENTION_AI_CALL_DAYS:90}
    audit-days: ${RETENTION_AUDIT_DAYS:1095}
    payment-notify-days: ${RETENTION_PAYMENT_NOTIFY_DAYS:180}
    cron: "${RETENTION_CRON:0 30 3 * * *}"
    zone: ${RETENTION_ZONE:Asia/Shanghai}
  interview:
    min-answer-length: 10
    max-answer-length: 4000
    session-idle-abandon: 24h
    report-max-attempts: 6
    # 语音作答音频保留天数（定时清理，0 表示不自动删除）。
    voice-retention-days: ${VOICE_RETENTION_DAYS:7}
    voice-retention-cron: ${VOICE_RETENTION_CRON:0 0 4 * * *}

logging:
  level:
    root: INFO
    com.offercoach: INFO