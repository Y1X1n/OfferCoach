server:
  port: ${SERVER_PORT:8095}
  shutdown: graceful
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: offercoach-ai-tts
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/offercoach}
    username: ${DB_USER:oc}
    password: ${DB_PASSWORD:oc_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:4}
      minimum-idle: 1
      connection-timeout: 3000
  flyway:
    enabled: false
  jackson:
    # Jackson 3 把 WRITE_DATES_AS_TIMESTAMPS 从 SerializationFeature 挪到了 DateTimeFeature，
    # 旧写法 spring.jackson.serialization.write-dates-as-timestamps 绑定不上会直接启动失败。
    # 3.x 的默认值已经是 false，这里显式写出是为了把「日期走 ISO 字符串、不走 epoch 数字」的契约钉住。
    datatype:
      datetime:
        write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # 数据库仅用于读配置与写日志；其不可用时工具能力降级，不应把进程判为不健康。
    db:
      enabled: false
    redis:
      enabled: false

oc:
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    small-model: ${AI_SMALL_MODEL:deepseek-chat}
    secret: ${OC_AI_SECRET:}
    allow-private-hosts: ${AI_ALLOW_PRIVATE_HOSTS:false}
    tools:
      internal-token: ${OC_AI_INTERNAL_TOKEN:}
      trace-mdc: true
      tts-timeout: ${AI_TTS_TIMEOUT:120s}
      tts-max-concurrency: ${AI_TTS_MAX_CONCURRENCY:20}
      tts-default-voice: ${AI_TTS_DEFAULT_VOICE:stella}
      tts-cache-dir: ${AI_TTS_CACHE_DIR:.local/storage/tts}
      tts-cache-days: ${AI_TTS_CACHE_DAYS:7}
      tts-cache-cron: ${AI_TTS_CACHE_CRON:0 45 3 * * *}
      call-log-enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] [%X{userId:-}] [%X{sessionId:-}] %logger{36} - %msg%n"
