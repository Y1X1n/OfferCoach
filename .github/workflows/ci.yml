name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # 启动冒烟需要真实的 PostgreSQL 与 Redis：光靠 mvn verify 只证明「能编译 + 单测过」，
    # 证明不了「进程能起来」。oc-pay-service 曾因 bean 构造器歧义无法启动，潜伏 9 天
    # 而 CI 全绿（PR #61）。service 容器只多约 10s 启动时间。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: offercoach
          POSTGRES_USER: oc
          POSTGRES_PASSWORD: oc_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oc -d offercoach"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 脚本 stdout 只输出 true/false，由这里写入 GITHUB_OUTPUT（文件命令只接受 key=value 行）
      - name: Detect backend changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          changed="$(bash .github/scripts/changed-paths.sh backend)"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.filter.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 一个 Maven 调用完成全部校验：spotless/checkstyle 已绑定 validate（规范问题约 4s 失败），
      # 模块并行（-T 1C）本地 clean verify 96s → 73s（约 -24%）
      - name: Maven verify
        if: steps.filter.outputs.changed == 'true'
        working-directory: backend
        run: mvn -B -ntp -T 1C verify
      # 复用 verify 阶段已产出的可执行 jar，不再重新构建；只验证「Spring 上下文能起来」。
      - name: Boot smoke
        if: steps.filter.outputs.changed == 'true'
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/offercoach
          DB_USER: oc
          DB_PASSWORD: oc_dev_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          BOOT_TIMEOUT: '120'
        run: bash ../.github/scripts/boot-smoke.sh
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/**/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 前端字体（*.ttf）由 Git LFS 托管，不拉取会得到指针文件导致构建产物损坏。
          lfs: true
      - name: Detect frontend changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          changed="$(bash .github/scripts/changed-paths.sh frontend)"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        if: steps.filter.outputs.changed == 'true'
        with:
          version: 10.23.0
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.changed == 'true'
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        if: steps.filter.outputs.changed == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # 拆成独立步骤：失败点一眼可见，且 build 前不再重复 typecheck（原先 pnpm check 会跑两次 vue-tsc）
      - name: Typecheck
        if: steps.filter.outputs.changed == 'true'
        working-directory: frontend
        run: pnpm typecheck
      - name: Lint
        if: steps.filter.outputs.changed == 'true'
        working-directory: frontend
        run: pnpm lint
      - name: Unit tests
        if: steps.filter.outputs.changed == 'true'
        working-directory: frontend
        run: pnpm test:unit
      - name: Build
        if: steps.filter.outputs.changed == 'true'
        working-directory: frontend
        run: pnpm exec vite build
