name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # 启动冒烟需要真实的 PostgreSQL 与 Redis：光靠 mvn verify 只证明「能编译 + 单测过」，
    # 证明不了「进程能起来」。oc-pay-service 曾因 bean 构造器歧义无法启动，潜伏 9 天
    # 而 CI 全绿（PR #61）。service 容器只多约 10s 启动时间。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: offercoach
          POSTGRES_USER: oc
          POSTGRES_PASSWORD: oc_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oc -d offercoach"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 脚本 stdout 只输出 true/false，由这里写入 GITHUB_OUTPUT（文件命令只接受 key=value 行）
      - name: Detect backend changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          changed="$(bash .github/scripts/changed-paths.sh backend)"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.filter.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 一个 Maven 调用完成全部校验：spotless/checkstyle 已绑定 validate（规范问题约 4s 失败），
      # 模块并行（-T 1C）本地 clean verify 96s → 73s（约 -24%）
      - name: Maven verify
        if: steps.filter.outputs.changed == 'true'
        working-directory: backend
        run: mvn -B -ntp -T 1C verify
      # 复用 verify 阶段已产出的可执行 jar，不再重新构建；只验证「Spring 上下文能起来」。
      - name: Boot smoke
        if: steps.filter.outputs.changed == 'true'
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/offercoach
          DB_USER: oc
          DB_PASSWORD: oc_dev_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          BOOT_TIMEOUT: '120'
        run: bash ../.github/scripts/boot-smoke.sh
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/**/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

  # 依赖漏洞扫描：用 OSV 公开漏洞库扫前端 lockfile。
  # 为什么不用 actions/dependency-review-action：它依赖仓库的 Dependency Graph，本仓库
  # /dependency-graph/sbom 返回 404（public 仓库该开关只能从设置页开启，API 改不动），
  # 接上去只会一直报 "not supported"。
  # 为什么不直接引 google/osv-scanner-action：它的 reusable workflow 形式在本仓库连续
  # startup_failure（该标签下没有可直接 uses 的 composite action），排查成本高于直接下
  # 官方二进制；这里参数、校验和与退出码都在本文件里可控。
  # 范围只到前端 lockfile：Maven 的 pom.xml 不锁传递依赖版本，扫 pom 结论不可信；后端
  # 依赖风险留给发布前人工审计（见 docs/ops/ci-cd.md）。
  dependency-scan:
    name: Dependency scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # 这里执行的是一个远程二进制：下载后先校验 SHA256 再安装，不校验就等于信任传输链路。
      - name: Install osv-scanner
        env:
          OSV_VERSION: v2.7.1
        run: |
          set -euo pipefail
          base="https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" "${base}/osv-scanner_linux_amd64"
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner_SHA256SUMS" "${base}/osv-scanner_SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep " osv-scanner_linux_amd64$" osv-scanner_SHA256SUMS \
            | sed 's/ osv-scanner_linux_amd64$/ osv-scanner/' | sha256sum -c -)
          install -m 0755 "$RUNNER_TEMP/osv-scanner" /usr/local/bin/osv-scanner
          osv-scanner --version
      # 有漏洞时 osv-scanner 退出码为 1，直接让 job 失败。--config 必须显式传：配置文件是
      # 按"被扫文件所在目录"发现的，扫 frontend/ 下的 lockfile 不会自动读仓库根目录那份。
      - name: Scan frontend lockfile
        run: osv-scanner --config=osv-scanner.toml --lockfile=frontend/pnpm-lock.yaml

  frontend:
    name: Frontend check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 前端字体（*.ttf）由 Git LFS 托管，不拉取会得到指针文件导致构建产物损坏。
          lfs: true
      - name: Detect frontend changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          changed="$(bash .github/scripts/changed-paths.sh frontend)"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        if: steps.filter.outputs.changed == 'true'
        with:
          version: 10.23.0
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.changed == 'true'
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        if: steps.filter.outputs.changed == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # 拆成独立步骤：失败点一眼可见，且 build 前不再重复 typecheck（原先 pnpm check 会跑两次 vue-tsc）
      - name: Typecheck
        if: steps.filter.outputs.changed == 'true'
        working-directory: frontend
        run: pnpm typecheck
      - name: Lint
        if: steps.filter.outputs.changed == 'true'
        working-directory: frontend
        run: pnpm lint
      - name: Unit tests
        if: steps.filter.outputs.changed == 'true'
        working-directory: frontend
        run: pnpm test:unit
      - name: Build
        if: steps.filter.outputs.changed == 'true'
        working-directory: frontend
        run: pnpm exec vite build

  # 运维脚本此前不在任何 job 的路径过滤里：只改 scripts/ 或 compose.yaml 时零检查。
  # bash -n 是零依赖的语法校验（不引入 shellcheck 镜像，Docker Hub 不可达时也能跑）。
  scripts:
    name: Shell syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect script changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          changed="$(bash .github/scripts/changed-paths.sh scripts)"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
      - name: bash -n
        if: steps.filter.outputs.changed == 'true'
        run: |
          status=0
          for file in scripts/*.sh backend/scripts/*.sh .github/scripts/*.sh; do
            [ -f "$file" ] || continue
            echo "checking $file"
            bash -n "$file" || status=1
          done
          exit "$status"
