name: Deploy GitHub Pages

# 注意：本仓库为私有库，GitHub Pages 未启用（API 返回 404）。
# 保留 push 触发会让任何 site/** 变更必然产生一次失败运行、白耗 runner 分钟，
# 因此改为仅手动触发；启用 Pages 后再恢复 push 触发。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4